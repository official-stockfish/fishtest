[project]
name = "fishtest"
version = "0.1.0"
description = "fishtest framework"
readme = "README.md"
requires-python = ">=3.15"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
target-version = "py315"
src = ["server", "worker"]
extend-exclude = ["worker/packages", "*.md"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["I"]

[tool.ruff.per-file-target-version]
"worker/**/*.py" = "py38"
