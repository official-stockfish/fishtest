name: CI worker posix

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/worker/packages
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python provides no Python 3.8 or 3.9 builds for Ubuntu 26.04
          - os: ubuntu-24.04
            python-version: "3.8"
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-26.04
            python-version: "3.10"
          - os: ubuntu-26.04
            python-version: "3.11"
          - os: ubuntu-26.04
            python-version: "3.12"
          - os: ubuntu-26.04
            python-version: "3.13"
          - os: ubuntu-26.04
            python-version: "3.14"
          - os: ubuntu-26.04
            python-version: "3.15"
          - os: macos-26
            python-version: "3.8"
          - os: macos-26
            python-version: "3.9"
          - os: macos-26
            python-version: "3.10"
          - os: macos-26
            python-version: "3.11"
          - os: macos-26
            python-version: "3.12"
          - os: macos-26
            python-version: "3.13"
          - os: macos-26
            python-version: "3.14"
          - os: macos-26
            python-version: "3.15"
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run worker tests
        run: python -m unittest discover -vb -s tests
