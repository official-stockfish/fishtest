name: CI server

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    # MongoDB 8.3 releases before 8.3.16 exit at startup on the Ubuntu
    # 7.0.0 kernels of ubuntu-24.04 and ubuntu-26.04 (SERVER-131779);
    # ubuntu-22.04 runs Linux 6.8
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.15"]
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: "8.3"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync project
        run: uv sync --group test

      - name: Run server tests
        run: uv run python -m unittest discover -vb -s tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
